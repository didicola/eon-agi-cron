name: eon-agi-cron

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  tick:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger cloud AGI self-improvement cycles
        run: |
          echo "[$(date -u +%FT%TZ)] firing eon-agi /run-cron ..."
          curl -sf -m 40 -X POST "https://eon-agi.eon-sovereign.workers.dev/run-cron" \
            -H "Content-Type: application/json"
          echo ""
          curl -sf -m 20 "https://eon-agi.eon-sovereign.workers.dev/health"
          echo ""

  goal:
    if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GHOST_TOKEN: ${{ secrets.GHOST_TOKEN }}
    steps:
      - name: Author cloud goal via cloud-brain and pin to ghost (with read-back)
        run: |
          set -e
          echo "[$(date -u +%FT%TZ)] fetching eon-agi stats ..."
          curl -sf -m 20 "https://eon-agi.eon-sovereign.workers.dev/health" > /tmp/health.json
          cat /tmp/health.json
          CYCLES=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('cycles',0))")
          PASS=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('passed',0))")
          MODS=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('mods',0))")
          BP=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('best_prompt','direct'))")
          echo "authoring goal via cloud-brain (curl) ..."
          curl -sf -m 40 -X POST "https://cloud-brain.eon-sovereign.workers.dev/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"deepseek-chat\",\"max_tokens\":60,\"messages\":[{\"role\":\"user\",\"content\":\"You are an autonomous self-improvement engine. Cloud stats: cycles=$CYCLES, passed=$PASS, self-mods=$MODS, best_prompt=$BP. Propose ONE concrete engineering improvement for your own pipeline (e.g. better verification strategy, new task type, prompt technique). Reply with exactly one short imperative sentence, no quotes, no preamble.\"}]}" \
            > /tmp/brain.json
          GOAL=$(python3 -c "import json;r=json.load(open('/tmp/brain.json'));print(r['choices'][0]['message']['content'].strip().splitlines()[-1][:120])")
          echo "GOAL: $GOAL"
          TS=$(date -u +%FT%TZ)
          TEXT="[agi-loop goal C ${TS} cycle=${CYCLES}] ${GOAL}"
          python3 -c "import json,sys;json.dump({'text':sys.argv[1],'pin':True},open('/tmp/pin.json','w'))" "$TEXT"
          echo "pinning to ghost (curl) ..."
          curl -sf -m 20 -X POST "https://ghost.eon-sovereign.workers.dev/memory?token=${GHOST_TOKEN}" \
            -H "Content-Type: application/json" --data @/tmp/pin.json
          echo ""
          sleep 3
          echo "read-back verification ..."
          curl -sf -m 20 "https://ghost.eon-sovereign.workers.dev/memory?token=${GHOST_TOKEN}" > /tmp/ghost_mem.json
          python3 -c "import json,sys;mem=json.load(open('/tmp/ghost_mem.json'));needle=json.loads(open('/tmp/pin.json').read())['text'][:60];found=any(needle in str(e.get('text','')) for e in mem);print('READ-BACK:','FOUND' if found else 'NOT FOUND','| needle:',needle);sys.exit(0 if found else 1)"
          echo "done"

  heartbeat:
    if: github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Hourly heartbeat (keeps cron alive)
        run: |
          mkdir -p hb; date -u +%FT%TZ > hb/last_beat.txt
          git config user.name "eon-agi-cron"; git config user.email "cron@eon.local"
          git add hb/last_beat.txt
          git diff --cached --quiet || git commit -m "heartbeat: $(date -u +%FT%TZ)"
          git push || true

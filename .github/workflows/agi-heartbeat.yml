name: eon-agi-heartbeat

on:
  schedule:
    - cron: '* * * * *'         # TEMP: schedule-fire proof (removed after test)
    - cron: '4-59/10 * * * *'   # 6x/hour watchdog (GH may delay up to ~15min under load)
    - cron: '17 * * * *'        # hourly goal author + heartbeat commit
  workflow_dispatch:

jobs:
  tick:
    # FIX (2026-10-13): old if compared '*/10 * * * *' against actual event string
    # '4-59/10 * * * *' -> never matched -> tick NEVER ran on schedule. Gate on event_name.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cloud watchdog — verify brain alive, drain ledger, self-heal if stale
        run: |
          set -e
          echo "[$(date -u +%FT%TZ)] watchdog tick"

          # 1) health probe (retry 3x)
          OK=0
          for i in 1 2 3; do
            if curl -sf -m 30 "https://eon-agi.eon-sovereign.workers.dev/health" > /tmp/health.json; then OK=1; break; fi
            echo "  health try $i failed"; sleep 5
          done
          if [ "$OK" != "1" ]; then echo "CRITICAL: eon-agi unreachable after 3 tries"; exit 1; fi
          cat /tmp/health.json; echo ""

          # 2) staleness check — DO alarm should run every 10 min; >25min stale = alarm broken
          if ! python3 - <<'PY'
          import json, sys, datetime
          h = json.load(open('/tmp/health.json'))
          lr = h.get('last_run', '')
          if not lr:
              print("no last_run -> STALE"); sys.exit(1)
          try:
              age = (datetime.datetime.now(datetime.timezone.utc) -
                     datetime.datetime.fromisoformat(lr.replace('Z', '+00:00'))).total_seconds()
              print(f"last_run age: {int(age)}s -> {'STALE' if age > 1500 else 'fresh'}")
              sys.exit(1 if age > 1500 else 0)
          except Exception as e:
              print(f"parse fail {e} -> assume STALE"); sys.exit(1)
          PY
          then
            echo "ALARM STALE — self-heal: POST /run-cron to kick cycles + rearm"
            curl -sf -m 60 -X POST "https://eon-agi.eon-sovereign.workers.dev/run-cron" -H "Content-Type: application/json" || true
            echo ""
          fi

          # 3) drain horus ledger (no-op when empty; keeps 24/7 execution guaranteed)
          curl -sf -m 30 -X POST "https://eon-agi.eon-sovereign.workers.dev/horus/drain" || true
          echo ""

          # 4) ledger summary for the log
          curl -sf -m 20 "https://eon-agi.eon-sovereign.workers.dev/horus/ledger" | python3 -c "import json,sys;d=json.load(sys.stdin);print('horus: pending',d['pending'],'done',d['meta']['done'],'fail',d['meta']['fail'])" || true
          echo "tick ok"

  goal:
    if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GHOST_TOKEN: ${{ secrets.GHOST_TOKEN }}
    steps:
      - name: Author cloud goal via cloud-brain and pin to ghost (with read-back)
        run: |
          set -e
          echo "[$(date -u +%FT%TZ)] fetching eon-agi stats ..."
          curl -sf -m 20 "https://eon-agi.eon-sovereign.workers.dev/health" > /tmp/health.json
          cat /tmp/health.json
          CYCLES=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('cycles',0))")
          PASS=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('passed',0))")
          MODS=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('mods',0))")
          BP=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('best_prompt','direct'))")
          echo "authoring goal via cloud-brain (curl, 90s, 2 tries) ..."
          CB_OK=0
          for try in 1 2; do
            if curl -sf -m 90 -X POST "https://cloud-brain.eon-sovereign.workers.dev/v1/chat/completions" -H "Content-Type: application/json" -d "{\"model\":\"deepseek-chat\",\"max_tokens\":60,\"messages\":[{\"role\":\"user\",\"content\":\"You are an autonomous self-improvement engine. Cloud stats: cycles=$CYCLES, passed=$PASS, self-mods=$MODS, best_prompt=$BP. Propose ONE concrete engineering improvement for your own pipeline (e.g. better verification strategy, new task type, prompt technique). Reply with exactly one short imperative sentence, no quotes, no preamble.\"}]}" > /tmp/brain.json; then
              CB_OK=1
              break
            fi
            echo "cloud-brain try $try failed, retrying..."
            sleep 5
          done
          if [ "$CB_OK" != "1" ]; then echo "cloud-brain failed after retries"; exit 1; fi
          GOAL=$(python3 -c "import json;r=json.load(open('/tmp/brain.json'));print(r['choices'][0]['message']['content'].strip().splitlines()[-1][:120])")
          echo "GOAL: $GOAL"
          TS=$(date -u +%FT%TZ)
          TEXT="[agi-loop goal C ${TS} cycle=${CYCLES}] ${GOAL}"
          python3 -c "import json,sys;json.dump({'text':sys.argv[1],'pin':True},open('/tmp/pin.json','w'))" "$TEXT"
          echo "pinning to ghost (curl) ..."
          curl -sf -m 20 -X POST "https://ghost.eon-sovereign.workers.dev/memory?token=${GHOST_TOKEN}" -H "Content-Type: application/json" --data @/tmp/pin.json
          echo ""
          echo "read-back verification (KV propagates up to ~90s) ..."
          for i in $(seq 1 18); do
            sleep 5
            curl -sf -m 20 "https://ghost.eon-sovereign.workers.dev/memory?token=${GHOST_TOKEN}" > /tmp/ghost_mem.json || continue
            if python3 -c "import json,sys;mem=json.load(open('/tmp/ghost_mem.json'));needle=json.loads(open('/tmp/pin.json').read())['text'][:60];found=any(needle in str(e.get('text','')) for e in mem);print('READ-BACK:',needle);sys.exit(0 if found else 1)"; then
              echo "VERIFIED after ${i} tries"
              echo "done"
              exit 0
            fi
            echo "  attempt $i: not visible yet"
          done
          echo "FAILED: pin never visible after 90s"
          exit 1

  heartbeat:
    if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Hourly heartbeat (keeps cron alive — GH disables schedule after 60d no-commit)
        run: |
          mkdir -p hb; date -u +%FT%TZ > hb/last_beat.txt
          git config user.name "eon-agi-cron"; git config user.email "cron@eon.local"
          git add hb/last_beat.txt
          git diff --cached --quiet || git commit -m "heartbeat: $(date -u +%FT%TZ)"
          git push || true

# reverse-engineered + fixed 2026-10-13:
#   - tick if-gate string mismatch (never fired) -> event_name gate
#   - tick = watchdog (staleness>25min -> /run-cron self-heal) not blind cycle driver
#     (DO alarm owns 10-min cycles; blind /run-cron would blow KV ~1000 puts/day)
#   - horus drain step: cloud 24/7 execution redundancy
#   - heartbeat now also on dispatch (repo activity keeps GH cron registered)
